name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout personal site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: site

      - name: Checkout RangeCraft poker trainer
        uses: actions/checkout@v4
        with:
          repository: Phyll1s0/poker
          ref: main
          path: poker-source
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: site
        run: pnpm run build

      - name: Build RangeCraft at /poker
        run: |
          npm ci --include=dev --prefix poker-source
          npm run build:pages --prefix poker-source
          rm -rf site/dist/poker
          mkdir -p site/dist/poker
          cp -R poker-source/dist-pages/. site/dist/poker/
          test -f site/dist/poker/index.html
          test -f site/dist/poker/sw.js
          test "$(cat site/dist/CNAME)" = "phyll1s0.com"
          grep -q '/poker/assets/' site/dist/poker/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
